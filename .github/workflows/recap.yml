name: recap-worlds

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC (~08:00 Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Générer et publier les résumés de matchs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: python3 scripts/cloud_recap.py

      - name: Commit des nouveaux articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "recap: nouveaux résumés de matchs (auto)"
            git push
          fi
